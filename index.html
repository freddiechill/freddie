        .link-btn:hover {

        .kick-live-active {

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const kickBtn = document.getElementById('kick-btn');
            const kickBadge = document.getElementById('kick-live-badge');
            const kickOfflineBadge = document.getElementById('kick-offline-badge');
            
            async function checkKickLiveStatus() {
                try {
                    // Kick'in Cloudflare korumasını aşmak için corsproxy.io alternatifini kullanıyoruz
                    const targetUrl = 'https://kick.com/api/v1/channels/freddiechill';
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                    
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error('Proxy veya Kick API erişimi reddetti.');
                    
                    // corsproxy doğrudan JSON formatında döner
                    const channelData = await response.json();
                    
                    // Kick API'sinde 'livestream' değeri null değilse kullanıcı yayındadır.
                    if (channelData && channelData.livestream !== null) {
                        // Canlı yayın açık tasarımı
                        kickBtn.classList.remove('border-zinc-600');
                        kickBtn.classList.add('kick-live-active');
                        kickBadge.classList.remove('hidden');
                        kickBadge.classList.add('flex');
                        kickOfflineBadge.classList.add('hidden');
                        kickOfflineBadge.classList.remove('flex');
                    } else {
                        // Canlı yayın kapalı tasarımı
                        kickBtn.classList.add('border-zinc-600');
                        kickBtn.classList.remove('kick-live-active');
                        kickBadge.classList.add('hidden');
                        kickBadge.classList.remove('flex');
                        kickOfflineBadge.classList.remove('hidden');
                        kickOfflineBadge.classList.add('flex');
                    }
                } catch (error) {
                    // console.error yerine console.warn kullanıyoruz (kırmızı hata fırlatmaz, sadece bilgi verir)
                    console.warn("Kick yayın durumu kontrol edilemedi (Muhtemelen Kick koruması). Sistem varsayılan olarak kapalı gösteriliyor.");
                    
                    // Hata durumunda (Kick engellese bile) kapalı tasarımında kalmasını sağlıyoruz
                    kickBtn.classList.add('border-zinc-600');
                    kickBtn.classList.remove('kick-live-active');
                    kickBadge.classList.add('hidden');
                    kickBadge.classList.remove('flex');
                    kickOfflineBadge.classList.remove('hidden');
                    kickOfflineBadge.classList.add('flex');
                }
            }

            // 1. Sayfa ilk açıldığında kontrol et
            checkKickLiveStatus();

            // 2. Sayfa açık kaldığı sürece arka planda her 2 dakikada (120.000 ms) bir yenile
            setInterval(checkKickLiveStatus, 120000); 
        });
    </script>
